# MM评分对比实验 — GD vs CCO vs CS vs ALA
#      python entrypoints/fit_point_cloud.py --config configs/fit_mm_compare.yaml --algo gd
#      python entrypoints/fit_point_cloud.py --config configs/fit_mm_compare.yaml --algo cco
#      python entrypoints/fit_point_cloud.py --config configs/fit_mm_compare.yaml --algo cs
#      python entrypoints/fit_point_cloud.py --config configs/fit_mm_compare.yaml --algo ala

task_type: '3d'
run_id: 1
data_file: '/home/m25lll/code/Fiting/fitting/datasets/synthetic/cylinder_4k.ply'

# ── 模型 ──
model:
  type: 'cylinder' # curve, surface, nurbs_surface, cylinder
  num_ctrl_u: 6
  num_ctrl_v: 6 #控制网格
  degree_u: 3
  degree_v: 3
  sample_u: 60
  sample_v: 60
  weight_lb: 0.8
  weight_ub: 1.2

# ── 设备 ──
device:
  train_device: 'cuda:1'
  cuda_deterministic: true
seeds: null

# ── 评分器: Mean Measure (Zhang et al. PR 2019) ──
estimator:
  type: 'mm'
  data_resolution: 0.01
  model_resolution: 0.004
  regularization_factor: 1.2
  incremental_coverage: true
  outlier_distance_factor: 2.5
  outlier_penalty_factor: 0.0
  bbox_margin_factor: 1.0
  bbox_penalty_factor: 0.0
  overlap_penalty_factor: 0.0
  control_smoothness_penalty_factor: 0.0
  mm_bbox_penalty_factor: 0.0
  early_rejection: true
  use_faiss: true

# ── 优化器 (algo_name 由 --algo 覆盖) ──
fitter:
  algo_name: 'cs'
  num_instances: 1

  max_episode: 100000                # 总评估次数
  gd_lr: 0.01
  gd_lr_min_factor: 0.1
  gd_eval_interval: 200
  gd_data_batch_size: 0
  gd_init: 'svd'
  gd_smoothness_weight: 0.05

  # Memetic 参数
  mem_pop_size: 200                 # 初始种群
  mem_min_pop: 30                   # 线性缩减到的最小种群
  mem_refine_every: 10              # 每N代局部精调
  mem_refine_steps: 100             # 精调步数
  mem_refine_method: 'adam'

  # CS/CCO/ALA 参数 (GD/Memetic忽略)
  num_envs: 4
  episodes_per_env: 50

# ── 输出 ──
record:
  root_dir: '/home/m25lll/code/Fiting/outputs/mm_compare/'
  pulse_size: 2000
  verbose: true
  trim_final_mesh: true
