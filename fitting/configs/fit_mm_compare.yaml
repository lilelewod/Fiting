# NURBS曲面拟合 — Memetic (NL-SHADE + Adam Refiner)
#      python entrypoints/fit_point_cloud.py --config configs/fit_mm_compare.yaml --model nurbs_surface --algo memetic
#      python entrypoints/fit_point_cloud.py --config configs/fit_mm_compare.yaml --model nurbs_surface --algo cco

task_type: '3d'
run_id: 1
data_file: '/home/m25lll/code/superquadic_data/shapes/ellipsoid/outlier_20.ply'

# ── 模型: 超椭球体 (16×16=256控制点×4=1024D) ──
model:
  type: 'superquadric'
  num_ctrl_u: 8
  num_ctrl_v: 8
  degree_u: 3
  degree_v: 3
  sample_u: 100
  sample_v: 100
  weight_lb: 0.8
  weight_ub: 1.2

# ── 设备 ──
device:
  train_device: 'cuda:1'
  cuda_deterministic: true
seeds: null

# ── 评分器: Mean Measure (λ=0.5) ──
estimator:
  type: 'mm'
  data_resolution: 0.01
  model_resolution: 0.004
  regularization_factor: 0.5       # 张老师默认
  incremental_coverage: true
  outlier_distance_factor: 2.5
  outlier_penalty_factor: 0.0
  bbox_margin_factor: 1.0
  bbox_penalty_factor: 0.0
  overlap_penalty_factor: 0.0
  control_smoothness_penalty_factor: 0.0    # 不加平滑，让NL-SHADE自由搜索
  mm_bbox_penalty_factor: 0.0               # 不加边界约束
  early_rejection: true              # NURBS支持分级采样
  use_faiss: true

# ── 优化器 ──
fitter:
  algo_name: 'cco'
  num_instances: 1

  max_episode: 50000                # 256D，够用

  # Memetic (NL-SHADE + Adam refiner)
  gd_lr: 0.01
  mem_pop_size: 100                 # 256D
  mem_min_pop: 20
  mem_refine_every: 10
  mem_refine_steps: 50
  mem_refine_method: 'adam'
  mem_refine_top_k: 1
  mem_adaptive_K: true
  mem_num_workers: 4

  # AES 参数 (256D)
  aes_pop_size: 25
  aes_skeleton_size: 12
  aes_refine_steps: 30
  aes_noise_scale: 0.1
  aes_restart_patience: 25
  aes_num_iters: 300

  # CCO/CS 参数
  num_envs: 8
  episodes_per_env: 50

# ── 输出 ──
record:
  root_dir: '/home/m25lll/code/Fiting/outputs/mm_compare/'
  pulse_size: 20
  verbose: true
  trim_final_mesh: true
